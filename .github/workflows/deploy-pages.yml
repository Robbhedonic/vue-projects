# Deploy to GitHub Pages. Use EITHER:
#   Branch: gh-pages, Folder: /   OR   Branch: main, Folder: docs
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only run the latest push; cancel previous runs (avoids "cancelled" confusion)
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      # Push docs to main first (Settings → Pages: Branch main, Folder docs). Survives GitHub 500 on gh-pages.
      - name: Deploy to main branch (docs folder)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Deploy to docs [skip ci]"
          git push

      # Optional: also update gh-pages (if GitHub returns 500, job still succeeds)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
        continue-on-error: true
